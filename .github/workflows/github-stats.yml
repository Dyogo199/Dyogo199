name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_stats.py"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate profile statistics from GitHub API
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/generate_profile_stats.py

      - name: Validate generated SVG cards
        shell: bash
        run: |
          set -euo pipefail

          for file in profile/stats.svg profile/top-langs.svg; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: $file is empty or missing."
              exit 1
            fi

            if ! grep -qiE '<svg([[:space:]>])' "$file"; then
              echo "ERROR: $file is not an SVG document."
              exit 1
            fi
          done

          echo "Generated SVG validation: OK"

      - name: Commit generated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"
          git push
